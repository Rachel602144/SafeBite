<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Health Insights - SafeBite</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <section class="dashboard-section">
    <div class="dashboard-card">
      <h2>Personal Health Insights</h2>

      <div class="insights-grid">

        <div class="stat-box">
          <h3 id="userCondition">-</h3>
          <p>Medical Condition</p>
        </div>

        <div class="stat-box">
          <h3 id="totalChecksInsight">0</h3>
          <p>Total Foods Analyzed</p>
        </div>

        <div class="stat-box">
          <h3 id="mostFrequentRisk">-</h3>
          <p>Most Frequent Risk</p>
        </div>

        <div class="stat-box">
          <h3 id="highRiskCount">0</h3>
          <p>High Risk Cases</p>
        </div>

      </div>

      <div class="recommendation-box">
        <h3>Recommendation</h3>
        <p id="recommendationText">-</p>
      </div>

    </div>
  </section>

  <script src="app.js"></script>
</body>

</html>
